# Prometheus — stack mina IoT (Docker internal DNS)
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: subscriber
    static_configs:
      - targets: ["subscriber:9101"]

  - job_name: publicador
    static_configs:
      - targets: ["publicador:9102"]

  - job_name: mongodb
    static_configs:
      - targets: ["mongodb_exporter:9216"]
