# Proyecto: mina_iot_sector_norte — abrir esta carpeta en Docker Desktop y ejecutar el compose.
# Antes de entregar o demo: sube los cambios a GitHub (git push) para que el rebuild refleje el mismo código que el remoto.
# CLI: docker compose up --build -d
# Stack: MongoDB, subscriber (AWS IoT), publicador, Flask, Streamlit (sin broker MQTT local).
# Monitorización: Prometheus :9090, Grafana :3000 (admin/admin), MongoDB exporter :9216.

name: mina_iot_sector_norte

services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s

  rest_api:
    build:
      context: ./iot_agro_project/rest_api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      - SECTOR_ID=sector_norte_Fuenzalida_Vallejos
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB=mina_iot
      - MONGO_COLLECTION=lecturas

  subscriber:
    build:
      context: ./iot_agro_project/mqtt_client
      dockerfile: Dockerfile
    ports:
      - "9101:9101"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - SECTOR_ID=sector_norte_Fuenzalida_Vallejos
      - AWS_IOT_ENDPOINT=a2apsmaa0mdv52-ats.iot.us-east-1.amazonaws.com
      - CERT_DIR=/app/certs
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB=mina_iot
      - MONGO_COLLECTION=lecturas
    volumes:
      - ./iot_agro_project/certs:/app/certs:ro

  publicador:
    build:
      context: ./iot_agro_project/sensors
      dockerfile: Dockerfile
    command: publicador_zona.py
    ports:
      - "9102:9102"
    depends_on:
      subscriber:
        condition: service_started
    restart: unless-stopped
    environment:
      - SECTOR_ID=sector_norte_Fuenzalida_Vallejos
      - AWS_IOT_ENDPOINT=a2apsmaa0mdv52-ats.iot.us-east-1.amazonaws.com
      - CERT_DIR=/app/certs
    volumes:
      - ./iot_agro_project/certs:/app/certs:ro

  frontend:
    build:
      context: ./iot_agro_project/frontend
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      rest_api:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - STREAMLIT_API_BASE=http://rest_api:5000
      - SECTOR_ID=sector_norte_Fuenzalida_Vallejos

  mongodb_exporter:
    image: percona/mongodb_exporter:0.42
    command:
      - "--mongodb.uri=mongodb://mongodb:27017"
    ports:
      - "9216:9216"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - subscriber
      - publicador
      - mongodb_exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mongo_data:
